[project]
name = "slingshot"
version = "0.1.0"
description = "Two-player gravity slingshot space game"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5",
]

[project.scripts]
slingshot = "slingshot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
